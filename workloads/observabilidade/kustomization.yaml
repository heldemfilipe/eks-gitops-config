apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - prometheusrule.yaml
configMapGenerator:
  - name: dashboard-pedidos
    files:
      - pedidos.json=dashboards/pedidos.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
