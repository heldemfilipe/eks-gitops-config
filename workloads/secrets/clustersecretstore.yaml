# Provider "fake": guarda os valores no próprio manifesto. Substitui o AWS Secrets Manager no laboratório.
# O valor abaixo não tem credencial (Mongo sem autenticação), então pode ficar no Git. Com um segredo de
# verdade, o provider seria "aws" (SecretsManager) autenticado por Pod Identity, e o valor nunca iria ao Git.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: lab-fake
spec:
  # Só ExternalSecrets destes namespaces podem usar o store: é o análogo local da "permissão mínima por
  # conta de serviço" do Pod Identity.
  conditions:
    - namespaces: [pedidos]
  provider:
    fake:
      data:
        - key: eks-lab/pedidos/mongodb-uri
          value: "mongodb://mongo:27017/pedidos"
