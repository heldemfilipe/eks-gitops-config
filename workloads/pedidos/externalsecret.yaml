apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pedidos-mongodb
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: lab-fake
  target:
    name: pedidos-mongodb
  data:
    - secretKey: MONGODB_URI
      remoteRef:
        key: eks-lab/pedidos/mongodb-uri
