apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedidos
  labels: { app: pedidos }
spec:
  selector:
    matchLabels: { app: pedidos }
  template:
    metadata:
      labels: { app: pedidos }
    spec:
      # Espalha as réplicas entre os workers. ScheduleAnyway: com um nó drenado, as duas podem ficar no outro.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: pedidos }
      # A política de "sem root" do Kyverno lê estes campos, não o USER do Dockerfile.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      # Com 20 s de shutdown graceful na API e 10 s de preStop, 40 s deixam folga antes do SIGKILL.
      terminationGracePeriodSeconds: 40
      containers:
        - name: api
          image: ghcr.io/heldemfilipe/orders-api # a tag vem do kustomization.yaml
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: cloud }
            # Entregue pelo External Secrets (ExternalSecret pedidos-mongodb). Nada de URI no manifesto.
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef: { name: pedidos-mongodb, key: MONGODB_URI }
          ports: [{ name: http, containerPort: 8080 }]
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 640Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          # O pod sai dos endpoints do Service e do Traefik de forma assincrona: sem esta espera, o SIGTERM chega
          # antes e as requisicoes em voo ou novas caem em EOF e connection refused (71 POST perdidos em um
          # rollout restart sob carga; com 10 s, 0). Veja docs/06 do eks-gitops-platform.
          lifecycle:
            preStop:
              sleep: { seconds: 10 }
          # A JVM demora para subir: sem a startupProbe a liveness mataria o pod antes da hora.
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
