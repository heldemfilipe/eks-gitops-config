# O HPA é dono do número de réplicas: por isso o Deployment não declara replicas.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pedidos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pedidos
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 } # sobre requests.cpu (250m)
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60 # padrão é 300; encurtado para o experimento
