apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pedidos
spec:
  ingressClassName: traefik
  rules:
    - host: pedidos.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pedidos
                port:
                  number: 8080
