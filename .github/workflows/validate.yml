name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Renderiza o Kustomize e valida o schema
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          # Recursos nativos são validados de verdade. CRDs (Argo CD, External Secrets, Prometheus) usam o
          # catálogo da comunidade; o que ele não conhece é ignorado, para o CI não quebrar por falta de schema.
          KC="./kubeconform -strict -summary -ignore-missing-schemas -schema-location default -schema-location https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
          for d in workloads/*/; do
            echo "== $d"
            kubectl kustomize "$d" | $KC -
          done
          echo "== root e apps"
          $KC root.yaml apps/
