apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pedidos
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2" # depois do External Secrets e do Traefik (CRDs do ExternalSecret)
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/heldemfilipe/eks-gitops-config
    targetRevision: main
    path: workloads/pedidos
  destination:
    server: https://kubernetes.default.svc
    namespace: pedidos
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 2m }
