# Regras de alerta e dashboard. Dependem dos CRDs do Prometheus Operator: por isso ficam na onda 1.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observabilidade
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/heldemfilipe/eks-gitops-config
    targetRevision: main
    path: workloads/observabilidade
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 2m }
